[package]
name = "qwencoder-bot"
version = "0.1.0"
edition = "2021"
description = "Autonomous AI coding agent using Qwen 2.5 Coder models"
authors = ["QwenCoder Bot"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Ollama API
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
toml = "0.8"

# Git operations
git2 = "0.19"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Command execution
async-process = "2"

# Template rendering for prompts
handlebars = "5"

# Regex for parsing
regex = "1"

# Path handling
dirs = "5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "qwencoder-bot"
path = "src/main.rs"
